name: nightly-cadence

# The nightly engine: pull the day's public record, render the digest,
# push. Zero model tokens on a normal night. See
# coconut-fleet/pipelines/INFERENCE-ECONOMICS.md for the doctrine.

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render digest from the public record
        run: node scripts/cadence-digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if the day produced anything
        run: |
          if [ -n "$(git status --porcelain content/cadence)" ]; then
            git config user.name "Shrey Patel"
            git config user.email "patelshrey77@gmail.com"
            git add content/cadence
            DAY=$(date -u +%F)
            git commit -m "cadence: nightly digest $DAY"
            git push
          else
            echo "quiet day, nothing to push"
          fi
      # Outpost publishing rides on the same digest. dev.to is API-keyed;
      # the step is inert until the DEVTO_API_KEY secret exists (a named
      # bend: creating platform keys is the operator's act). RSS already
      # feeds the import-based platforms.
      - name: Publish to dev.to (inert until key exists)
        if: ${{ vars.DEVTO_ENABLED == 'true' }}
        run: echo "devto publishing enabled; implement against the digest file"
