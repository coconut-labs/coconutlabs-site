name: Lighthouse

on:
  pull_request:
  workflow_dispatch:
  # Work lands straight on main here, so a pull_request-only trigger meant this
  # gate had never run once in the life of the repo. Weekly keeps it honest
  # without putting a Lighthouse build in front of every push.
  schedule:
    - cron: "40 15 * * 1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
