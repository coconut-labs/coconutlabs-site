name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about three minutes. A run that passes fifteen is hung,
    # not slow: one sat in_progress for 53 minutes and would have burned the
    # six-hour default before anyone noticed.
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The locked design system's mechanical gate. Blocking: raw hex, em
      # dashes in prose, icon libraries, radius literals, retired palette.
      - run: npm run lint:design
      - run: npm run test
      - run: npm run build
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:e2e
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}

  visual:
    # Pixel gate, BLOCKING. Both darwin (local) and linux (CI) baselines are
    # committed; any rendered pixel change fails until a baseline is updated
    # with a stated reason. See docs/design-system.md section 8.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next start (the deterministic visual server) needs a build first.
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
