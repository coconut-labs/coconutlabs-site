name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The e2e suite runs webkit, whose system libraries the ubuntu-latest image
    # does not ship. Installing them meant `playwright install --with-deps`,
    # which runs apt-get on every job; it hung for fourteen minutes against the
    # Ubuntu mirror and took the whole run to the timeout with it. This image
    # has all three browsers and their libraries baked in, so there is no apt
    # step to hang. Keep the tag pinned to the @playwright/test version in
    # package.json: a mismatch and the browsers stop matching the runner.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      # Firefox refuses to start when $HOME is owned by another user, and in
      # this container the job runs as root while /github/home belongs to
      # pwuser. Playwright's own launch error prescribes exactly this.
      HOME: /root
    # The suite runs in about three minutes. A run that passes fifteen is hung,
    # not slow: one sat in_progress for 53 minutes and would have burned the
    # six-hour default before anyone noticed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The locked design system's mechanical gate. Blocking: raw hex, em
      # dashes in prose, icon libraries, radius literals, retired palette.
      - run: npm run lint:design
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}

  visual:
    # Pixel gate, BLOCKING. Both darwin (local) and linux (CI) baselines are
    # committed; any rendered pixel change fails until a baseline is updated
    # with a stated reason. See docs/design-system.md section 8.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next start (the deterministic visual server) needs a build first.
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
